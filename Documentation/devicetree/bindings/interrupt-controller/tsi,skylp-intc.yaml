%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/tsi,skylp-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TSI SkyLP interrupt collector

maintainers:
  - Mahesh Babu <maheshbabu@tsavoritesi.com>

description: |
  Interrupt collector block of a TSI SkyLP chiplet. Each instance
  latches up to 32 level-sensitive IP sources and fans them out to four
  independently maskable destination groups (g0..g3); one group is
  routed towards the application processor's GIC as an SPI, the others
  may serve other masters (e.g. the M85 management core). One node
  drives exactly one destination group.

  The first user is the GPP/UDI instance in front of the USB/DP
  subsystem (bit 0 usb_intr, bit 1 dptx_intr, bits 2-5 video bridge,
  bits 6-7 audio). The collectors inside the IO corners are handled by
  the tsi,skylp-pinctrl binding instead, since they share the corner's
  register window.

  The node is deliberately usable without "interrupts": the
  collector-to-GIC routing (which group, which SPI INTID) is not yet
  confirmed against the SoC interrupt map. Without it the driver probes
  dormant - consumers can map and request their lines, nothing
  dispatches. Note that unmasking a line arms the collector's global
  per-source enable, which is shared with the other three destination
  groups.

  Only level triggers are supported; the collector has no polarity
  control.

properties:
  compatible:
    const: tsi,skylp-intc

  reg:
    maxItems: 1
    description: |
      The collector's register window, from the pending register to the
      last destination group (0x40 bytes). This is a standalone MMIO
      window and must be left out of any tsi,skylp-chiplet node's "reg",
      which claims its whole CSR window exclusively.

  interrupts:
    maxItems: 1
    description:
      Parent SPI carrying the destination group selected by
      tsi,dest-group. Absent until the routing is confirmed; see above.

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  tsi,dest-group:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 3
    default: 0
    description:
      Which of the four destination groups this node owns and (with
      "interrupts") the parent SPI carries.

  tsi,num-sources:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 32
    default: 32
    description:
      Number of wired sources in this instance (8 for the GPP/UDI
      collector).

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    /* GPP/UDI collector, dormant until the GIC routing is confirmed. */
    interrupt-controller@24000108 {
        compatible = "tsi,skylp-intc";
        reg = <0x24000108 0x40>;
        interrupt-controller;
        #interrupt-cells = <2>;
        tsi,dest-group = <0>;
        tsi,num-sources = <8>;
    };
