%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/tsi,skylp-usb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TSI SkyLP USB3.2 DRD controller (SOC USB3 DRD core)

maintainers:
  - Mahesh Babu <maheshbabu@tsavoritesi.com>

description: |
  The USB3.2 dual-role controller of the TSI SkyLP chiplet's UDI
  subsystem: the Innosilicon-integrated SOC USB3 DRD core (a
  DWC3-register-compatible IP whose ID registers are not populated, so
  it binds to the soc_drd driver, not to snps,dwc3).

  On top of the plain "soc,soc_drd3" controller node this binding adds
  the SkyLP platform init the vendor driver leaves empty: the TSAR
  block-control release, the UDI reference-clock select, and the
  mandatory Type-C lane-mux write. The mux word resets to "no
  connection", so a node without the tsi-mux window can never train a
  link.

  The TSAR and clock-select VALUES are intentionally DT-supplied
  (tsi,tsar-init / tsi,clksel-init); a step is skipped when its
  property is absent, and the mux write always happens. The TSAR bit
  assignment is still being confirmed with the hardware team; the
  clock-select bits are documented under tsi,clksel-init below.

  The optional UDI reset-release window (gpp udi_reset_cfg) is
  window-gated rather than value-gated: a board that declares it wants
  Linux to release por_n (with the validated >= 100 us settle after
  it) and the AHB/APB/USB-AXI resets; one that leaves it out had
  firmware release them. The driver read-modify-writes the word, so
  the DP/video/audio release bits stay with their own drivers.

  All windows are standalone MMIO ranges and must be left out of any
  tsi,skylp-chiplet node's "reg". The tsar/clksel words are mapped
  without claiming a region since they sit inside CSR space the chiplet
  core may own; the mux word sits inside the DP/PHY APB window the
  tsi,skylp-dp node claims.

properties:
  compatible:
    items:
      - const: tsi,skylp-usb
      - const: soc,soc_drd3

  reg:
    minItems: 2
    items:
      - description: Controller registers (xHCI window followed by the
          global registers at +0xc100)
      - description: Type-C lane-mux word
      - description: TSAR block-control word
      - description: UDI reference-clock-select word
      - description: UDI reset-release word (gpp udi_reset_cfg)

  reg-names:
    minItems: 2
    items:
      - const: usb
      - const: tsi-mux
      - const: tsi-tsar
      - const: tsi-clksel
      - const: tsi-reset

  interrupts:
    maxItems: 1

  interrupts-extended:
    maxItems: 1
    description:
      The usb_intr line usually sits behind the UDI interrupt
      collector rather than directly on the GIC, so this encoding is
      the common one (as in the example below). Exactly one of
      "interrupts" or "interrupts-extended" must be present.

  clocks:
    description:
      Clocks feeding the UDI USB subsystem. The soc_drd controller
      driver itself consumes no clocks, so the SkyLP integration
      enables every clock listed here before running the init sequence
      and holds them for the device's lifetime. Optional until the UDI
      clock topology is confirmed.
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

  tsi,tsar-init:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Value written to the TSAR block-control word first in the init
      sequence, followed by a >= 100 us settle. Requires the tsi-tsar
      window.

  tsi,clksel-init:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 0x7
    description: |
      Value written to the UDI reference-clock-select word before the
      mux write. Requires the tsi-clksel window. Bits (hardware team,
      2026-10-07):
        bit 0  refclk_sel       0 single-ended, 1 differential reference
        bit 1  refclk100m_sel   0 use 50 MHz FREF, 1 use FREF_100M
        bit 2  div2_clken       feed the controller ref_clk FREF / 2
      div2_clken RESETS TO 1 (udi_clk_sel reset {0, 0, 1}), so the
      controller ref_clk is 25 MHz by default; the driver programs
      GUCTL.REFCLKPER and GCTL.PWRDNSCALE for 25 MHz unless this
      property explicitly clears div2_clken, in which case it programs
      them for the full 50 MHz FREF.

  tsi,mux-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]
    default: 1
    description:
      Type-C lane-mux mode. 0 = no connection (reset value), 1 = USB3.2
      Gen2x2, 2 = USB3.2 + 2-lane DisplayPort, 3 = 4-lane DisplayPort.

  tsi,mux-flip:
    type: boolean
    description:
      Boot-time cable orientation. Runtime orientation tracking is the
      tsi,skylp-typec node's job.

  dr_mode:
    enum: [host, peripheral, otg]
    description:
      Fixed role. The controller ships no role-switching layer, so this
      is the role for the lifetime of the device.

  maximum-speed:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [super-speed-plus, super-speed, high-speed, full-speed]

  phy_type:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [utmi, utmi_wide]
    description:
      Width of the controller's USB 2.0 UTMI interface. Note the USB2
      PHY is off-macro on SkyLP, so this only sizes the controller-side
      interface.

  usb-psy-name:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Name of a power supply the gadget path reports its current draw
      to. Optional; absent means no reporting.

  dma-coherent: true

  iommus:
    maxItems: 1

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

patternProperties:
  # The vendor controller carries a large set of errata and threshold
  # knobs in its own namespace. They belong to the soc,soc_drd3
  # fallback, which has no binding of its own, so accept the namespace
  # rather than duplicating three dozen entries here.
  "^soc,[a-z0-9-_]+$":
    description:
      Vendor soc_drd quirk, erratum or threshold property. See the
      driver for the accepted set.

required:
  - compatible
  - reg
  - reg-names

oneOf:
  - required: [ interrupts ]
  - required: [ interrupts-extended ]

additionalProperties: false

examples:
  - |
    usb@24000150 {
        compatible = "tsi,skylp-usb", "soc,soc_drd3";
        reg = <0x24000150 0x10000>,
              <0x24021714 0x4>,
              <0x24000008 0x4>,
              <0x2400014c 0x4>;
        reg-names = "usb", "tsi-mux", "tsi-tsar", "tsi-clksel";
        /* usb_intr, line 0 of the UDI collector */
        interrupts-extended = <&udi_intc 0 4>;
        dr_mode = "host";
        maximum-speed = "super-speed-plus";
        phy_type = "utmi_wide";
        soc,dis_u3_susphy_quirk;
        soc,dis_u2_susphy_quirk;
        tsi,mux-mode = <1>;
    };
