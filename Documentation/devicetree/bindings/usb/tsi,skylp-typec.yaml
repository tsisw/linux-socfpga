%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/tsi,skylp-typec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TSI SkyLP Type-C plug/orientation glue

maintainers:
  - Mahesh Babu <maheshbabu@tsavoritesi.com>

description: |
  Driver for the TSI SkyLP Type-C lane mux. The mux register selects the
  lane mode (USB 3.2, USB + 2-lane DisplayPort, or 4-lane DisplayPort)
  and the cable orientation, so this node is both a Type-C mode switch
  and an orientation switch.

  On a board with a Type-C port manager, add "mode-switch",
  "orientation-switch" and the "port" graph link; the port manager then
  drives the mux through the usual Type-C interfaces and no other
  properties are needed.

  Helix-M has no port manager: it has no TCPC, and its TI TPS25730D PD
  controller is autonomous and sink-only. There the mux is driven from
  the board's own signals instead - the PD controller reports plug state
  and cable orientation on GPIO lines, and this node follows whichever of
  them the board routes to the SoC. They are polled, because the SkyLP
  GPIO interrupt path is level-only and the pad routing is unconfirmed.
  Note that on Helix-M only the plug-event line reaches the SoC; the
  orientation line terminates on the board CPLD, so the mux necessarily
  runs at a fixed orientation.

  With neither the switch properties nor the GPIOs, the node programs a
  fixed mode and orientation once at probe - which is still mandatory,
  because the mux resets to "no connection".

  The mux word sits inside the DP/PHY APB window the DP node claims, so
  it is mapped without claiming a region.

properties:
  compatible:
    const: tsi,skylp-typec

  reg:
    maxItems: 1
    description: The Type-C lane-mux word.

  plug-event-gpios:
    maxItems: 1
    description: PD controller's plug-detect line (TPS25730D
      USB_PLUG_EVENT). Polarity comes from the GPIO flags.

  plug-flip-gpios:
    maxItems: 1
    description: PD controller's cable-orientation line (TPS25730D
      USB_PLUG_FLIP). Polarity comes from the GPIO flags.

  tsi,mux-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]
    default: 1
    description:
      Initial Type-C lane-mux mode, and the mode held while updating the
      flip bit when no port manager is present. 0 = no connection (the
      reset value), 1 = USB3.2 Gen2x2, 2 = USB3.2 + 2-lane DisplayPort,
      3 = 4-lane DisplayPort. A port manager overrides this at runtime.

  mode-switch:
    type: boolean
    description:
      Present when a Type-C port manager drives the lane mode through
      this node. Requires "port".

  orientation-switch:
    type: boolean
    description:
      Present when a Type-C port manager drives the cable orientation
      through this node. Requires "port".

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      Graph link to the Type-C controller that drives the mode and
      orientation switches. Absent on boards without a port manager.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    typec@24021714 {
        compatible = "tsi,skylp-typec";
        reg = <0x24021714 0x4>;
        plug-event-gpios = <&ionw_pinctrl 4 GPIO_ACTIVE_HIGH>;
        plug-flip-gpios = <&ionw_pinctrl 5 GPIO_ACTIVE_HIGH>;
        tsi,mux-mode = <1>;
    };
